# ============================================================
# Nginx configuration cho JIRA Dashboard (React SPA)
# ============================================================

server {
    listen 80;
    server_name _;

    # Thư mục gốc chứa static files (được copy từ build stage)
    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # Gzip nén cho các loại file phổ biến
    # ============================================================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;

    # ============================================================
    # Security headers
    # ============================================================
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ============================================================
    # SPA routing — mọi đường dẫn không khớp file tĩnh đều trả về index.html
    # để React Router xử lý client-side routing
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # Cache tĩnh — JS, CSS, fonts, images được cache 1 năm
    # (Vite bundle có content hash trong tên file, nên an toàn để cache lâu dài)
    # ============================================================
    location ~* \.(?:js|css|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ============================================================
    # Login endpoint — returns JSESSIONID cookie
    # ============================================================
    location = /api/auth/login {
        proxy_pass https://20.84.97.109:3033/rest/auth/1/session;
        proxy_ssl_verify off;
        proxy_set_header Host 20.84.97.109:3033;
        proxy_set_header Content-Type "application/json";
        proxy_pass_header Set-Cookie;
    }

    # ============================================================
    # API Proxy — chuyển tiếp /api/jira tới JIRA backend
    # (tương tự cấu hình trong vite.config.js)
    # - Strip prefix /api/jira trước khi forward
    # - SSL verify tắt (secure: false) vì backend dùng self-signed cert
    # ============================================================
    location /api/jira {
        rewrite ^/api/jira(/.*)$ $1 break;
        proxy_pass https://20.84.97.109:3033;  # TODO: Xác nhận JIRA backend URL trong môi trường production
        proxy_ssl_verify off;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        proxy_set_header Host 20.84.97.109:3033;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
